<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fff4f8"><meta name="description" content="RSVP for SKY’s first birthday on 10 October 2026."><title>SKY is turning ONE — RSVP</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,500;0,600;1,500;1,600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box} :root{--ink:#40283a;--muted:#795f70;--hot:#c93272;--paper:#fffaf7}
body{margin:0;min-height:100svh;padding:18px;display:grid;place-items:center;background:#20172a;color:var(--ink);font-family:'DM Sans',sans-serif}
.backdrop{position:fixed;inset:0;background:linear-gradient(#130b1870,#130b18bb),url('assets/sky-photo.png') center 36%/cover;filter:blur(4px);transform:scale(1.04)}
.card{position:relative;width:min(100%,440px);overflow:hidden;border:1px solid #ffffff70;border-radius:26px;background:var(--paper);box-shadow:0 24px 80px #08040b80;animation:arrive .7s both}
.photo{height:clamp(190px,52vw,255px);background:url('assets/sky-photo.png') center 34%/cover no-repeat;position:relative}.photo:after{content:'';position:absolute;inset:50% 0 0;background:linear-gradient(transparent,var(--paper))}
.content{position:relative;margin-top:-6px;padding:0 24px 24px;text-align:center}.eyebrow{margin:0 0 8px;color:var(--hot);font-size:10px;font-weight:800;letter-spacing:.18em}
h1{margin:0;font:500 clamp(30px,8vw,39px)/1.05 'Playfair Display',serif;letter-spacing:-.03em}h1 em{color:var(--hot);font-weight:500}
.subtitle{margin:9px 0 16px;color:var(--muted);font:500 16px 'Playfair Display',serif}
.details{margin:0 auto 18px;padding:11px 8px;border-block:1px solid #eacbd8;color:#68485a;font-size:12px;line-height:1.85}.details strong{color:var(--ink)}
label{display:block;margin-bottom:7px;text-align:left;color:#69445a;font-size:11px;font-weight:800;letter-spacing:.08em}
input{width:100%;height:49px;padding:0 13px;border:1px solid #e4c9d7;border-radius:13px;background:#fffdfc;color:var(--ink);font:500 15px 'DM Sans',sans-serif;outline:none}input:focus{border-color:#d45a91;box-shadow:0 0 0 3px #f6d7e5}
.buttons{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:13px}button{min-height:52px;border:0;border-radius:13px;padding:10px 8px;cursor:pointer;font:800 11px 'DM Sans',sans-serif}button:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.yes{background:linear-gradient(135deg,#ed6da3,#c93272);color:white;box-shadow:0 6px 16px #c9327233}.no,.edit,.close{border:1px solid #efcfdf;background:#fff0f6;color:#8b526f}
.note{margin:13px 0 0;color:#947d8a;font-size:10px;line-height:1.5}.error{display:none;margin:8px 0 0;color:#ae315c;font-size:12px;text-align:left}.error.show{display:block}
.response{display:none;padding:10px 0 0}.response.show{display:block;animation:arrive .4s both}.emoji{font-size:54px}.response h2{margin:4px 0;font:500 25px 'Playfair Display',serif}.response p{color:var(--muted);font-size:13px;line-height:1.6}.edit,.close{min-height:40px;padding:8px 15px}
.popup{position:fixed;inset:0;z-index:4;display:grid;place-items:center;padding:20px;background:#130b1888;opacity:0;visibility:hidden;transition:.2s}.popup.show{opacity:1;visibility:visible}.popup-card{width:min(100%,330px);padding:26px 22px 22px;border-radius:23px;background:var(--paper);text-align:center;box-shadow:0 18px 70px #0005;transform:translateY(10px) scale(.96);transition:.25s}.popup.show .popup-card{transform:none}.pop-emoji{display:block;font-size:61px;animation:bop .7s ease-in-out infinite alternate}.popup-card h2{margin:5px 0;font:500 29px 'Playfair Display',serif}.popup-card p{color:var(--muted);font-size:14px;line-height:1.55}
.confetti{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:3}.confetti i{position:absolute;top:-12px;width:9px;height:13px;border-radius:2px;animation:fall var(--duration) linear forwards}
@keyframes arrive{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}@keyframes bop{to{transform:translateY(-6px) rotate(4deg)}}@keyframes fall{to{transform:translate3d(var(--drift),110vh,0) rotate(700deg)}}
@media(max-width:380px){body{padding:12px}.card{border-radius:22px}.content{padding:0 18px 20px}.details{font-size:11px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style></head>
<body><div class="backdrop" aria-hidden="true"></div><main class="card"><div class="photo" role="img" aria-label="Sky at his first birthday celebration"></div><section class="content">
<p class="eyebrow">A LITTLE PARTY, A BIG MILESTONE</p><h1>SKY is turning <em>ONE!</em></h1><p class="subtitle">Will you celebrate with me?</p>
<p class="details"><strong>Saturday, 10 October 2026</strong><br>6:00–9:00 PM · 52 Castle St., Chapel Langley<br>Luton, LU1 3AG</p>
<div id="form"><label for="guest">YOUR NAME</label><input id="guest" maxlength="80" autocomplete="name" placeholder="Type your name here"><p class="error" id="error" role="alert">Please enter your name first 💗</p>
<div class="buttons"><button class="yes" type="button" onclick="choose('yes')">YES, I'LL BE THERE 😍</button><button class="no" type="button" onclick="choose('no')">SORRY, CAN'T COME 😕</button></div><p class="note">Your answer goes privately to <strong>JOMI &amp; STEFFY</strong> ✨</p></div>
<div class="response" id="response" aria-live="polite"><div class="emoji" id="emoji">😍</div><h2 id="thanks">Yay! See you there!</h2><p id="message"></p><button class="edit" type="button" onclick="resetChoice()">Change my answer</button></div>
</section></main><div class="confetti" id="confetti" aria-hidden="true"></div>
<div class="popup" id="popup" role="dialog" aria-modal="true" aria-live="polite" onclick="closePopup(event)"><div class="popup-card"><span class="pop-emoji" id="popEmoji">😍</span><h2 id="popTitle">Yay!</h2><p id="popMessage"></p><button class="close" type="button" onclick="closePopup()">Aww, okay 💗</button></div></div>
<script>
const endpoint='https://script.google.com/macros/s/AKfycbxndzxwtPPv3UqiDh4MpF0KZ-3VouvnKFKLEN5KvOl9WHODp9kCq_UaZb1-JYIp_nhNqA/exec';
async function choose(answer){const name=document.getElementById('guest').value.trim();if(!name){document.getElementById('error').classList.add('show');document.getElementById('guest').focus();return}document.getElementById('error').classList.remove('show');const buttons=[...document.querySelectorAll('.buttons button')];buttons.forEach(b=>b.disabled=true);try{await fetch(endpoint,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({name,answer})});document.getElementById('form').style.display='none';document.getElementById('response').classList.add('show');document.getElementById('emoji').textContent=answer==='yes'?'😍':'😕';document.getElementById('thanks').textContent=answer==='yes'?'Yay! See you there!':'Aww, we’ll miss you!';document.getElementById('message').textContent=answer==='yes'?'Thank you, '+name+'! We can’t wait to celebrate with you. 💗':'Thank you for letting us know, '+name+'. Sending you a big hug! 💗';document.getElementById('popEmoji').textContent=answer==='yes'?'😍':'😢';document.getElementById('popTitle').textContent=answer==='yes'?'Yay!':'Aww!';document.getElementById('popMessage').textContent=answer==='yes'?'We can’t wait to celebrate with you, '+name+'! 💗':'We’ll miss you, '+name+'. Sending you a big hug! 💗';document.getElementById('popup').classList.add('show');if(answer==='yes')confetti()}catch(e){document.getElementById('error').textContent='Sorry, that did not go through. Please check your connection and try again.';document.getElementById('error').classList.add('show');buttons.forEach(b=>b.disabled=false)}}
function closePopup(e){if(e&&e.target!==e.currentTarget)return;document.getElementById('popup').classList.remove('show')}
function resetChoice(){document.getElementById('response').classList.remove('show');document.getElementById('form').style.display='block';document.querySelectorAll('.buttons button').forEach(b=>b.disabled=false)}
function confetti(){const root=document.getElementById('confetti'),colors=['#ef6ea3','#e8bb62','#98c9d3','#b9a0d4','#f6d8a7'];for(let i=0;i<42;i++){const p=document.createElement('i');p.style.left=Math.random()*100+'%';p.style.background=colors[i%colors.length];p.style.setProperty('--duration',(2+Math.random()*2)+'s');p.style.setProperty('--drift',(Math.random()*160-80)+'px');root.appendChild(p);setTimeout(()=>p.remove(),4500)}}
document.getElementById('guest').addEventListener('keydown',e=>{if(e.key==='Enter')choose('yes')});
</script></body></html>
